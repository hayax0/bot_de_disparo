services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: saas_bot_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_bot_db}
      POSTGRES_USER: ${POSTGRES_USER:-saas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas_admin} -d ${POSTGRES_DB:-saas_bot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M

  # Redis para Fila de Disparos BullMQ (com requirepass protegido)
  redis:
    image: redis:7-alpine
    container_name: saas_bot_redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?Defina REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Backend Node.js API + BullMQ Worker
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_bot_backend
    restart: always
    init: true
    shm_size: '1gb'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-saas_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saas_bot_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET seguro no .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
      CAKTO_WEBHOOK_SECRET: ${CAKTO_WEBHOOK_SECRET:?Configure o mesmo segredo forte na Cakto e no .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-CMPX Bot Disparo <noreply@botdisparo.cmpx.tec.br>}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-cmpxsuporte@gmail.com}
      PLATFORM_URL: ${PLATFORM_URL:-https://botdisparo.cmpx.tec.br}
      CRON_SECRET: ${CRON_SECRET:?Defina CRON_SECRET forte no .env}
    volumes:
      - ./backend/.baileys_auth:/app/.baileys_auth
      - ./backend/uploads:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        INTERNAL_API_URL: http://backend:3001
    container_name: saas_bot_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:3001
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M

networks:
  internal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
